name: Browser and local Ollama end-to-end

on:
  push:
    branches: [main, "test/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-ollama-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ollama:
    name: Chromium + real local model
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OLLAMA_TEST_MODEL: qwen2.5:0.5b
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: 10m
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run unit and integration tests
        run: npm test

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true

      - name: Start Ollama and pull the small test model
        run: |
          OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_NO_CLOUD=1 ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ollama.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$OLLAMA_TEST_MODEL"

      - name: Start static app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/app-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app-server.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Test the real browser and local-model flows
        run: node scripts/e2e-browser-ollama.mjs

      - name: Preserve diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ollama-diagnostics
          path: |
            ${{ runner.temp }}/ollama.log
            ${{ runner.temp }}/app-server.log
          if-no-files-found: ignore
