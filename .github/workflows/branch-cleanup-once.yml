name: One-time remote branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete remote branches except main and development
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t branches < <(gh api --paginate --jq '.[].name' "repos/${REPOSITORY}/branches?per_page=100")
          for branch in "${branches[@]}"; do
            [[ -n "${branch}" ]] || continue
            case "${branch}" in
              main|development)
                echo "Keeping ${branch}"
                ;;
              *)
                echo "Deleting ${branch}"
                gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
                ;;
            esac
          done
